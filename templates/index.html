<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hantavirüs Tanı Sihirbazı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-[#1e293b] rounded-2xl shadow-2xl overflow-hidden animate-fade-in border border-gray-700">
        
        <div class="header-section text-center p-8 bg-gradient-to-r from-red-700 to-indigo-900 shadow-xl">
            <div class="flex justify-end mb-2">
                <a href="{{ url_for('logout') }}" class="text-xs bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-white font-medium transition-all">Çıkış Yap</a>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Hantavirüs (Andes) Virüsü Tanı Sihirbazı</h1>
            <p class="text-lg text-indigo-100">Hoş geldin, <span class="font-bold text-white">{{ isim }}</span>!</p>
            <p class="italic text-sm text-gray-300 mt-2">Lütfen tüm soruları mevcut durumunuza göre yanıtlayın.</p>
        </div>

        <div class="p-8 space-y-6">
            <form id="quizForm" class="space-y-6">
                <div id="questionsContainer" class="space-y-4">
                    </div>

                <button type="button" onclick="analizEt()" class="w-full py-4 bg-white text-black font-black rounded-xl hover:bg-gray-200 transition-all shadow-lg text-lg uppercase tracking-tighter">
                    DETAYLI ANALİZİ TAMAMLA
                </button>
            </form>

            <div id="resultBox" class="hidden"></div>
        </div>
    </div>

    <script>
        const sorular = [
            "Yüksek Ateş (38°C+)", "Şiddetli Baş Ağrısı", "Kas ve Eklem Ağrıları", 
            "Öksürük ve Nefes Darlığı", "Mide Bulantısı veya Kusma", "İshal veya Karın Ağrısı", 
            "Aşırı Halsizlik", "Işığa Karşı Duyarlılık", "Böcek/Kemirgen Teması", "Gözlerde Kızarıklık"
        ];

        const container = document.getElementById('questionsContainer');
        sorular.forEach((soru, index) => {
            container.innerHTML += `
                <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700">
                    <label class="block text-gray-200 font-bold mb-3">${index + 1}. ${soru}</label>
                    <select class="w-full p-3 bg-gray-900 text-white rounded-lg border border-gray-600 focus:ring-2 focus:ring-red-500 outline-none">
                        <option value="0">Yok / Belirti Yok</option>
                        <option value="1">Hafif</option>
                        <option value="2">Orta</option>
                        <option value="3">Şiddetli</option>
                    </select>
                </div>
            `;
        });

        function analizEt() {
            const selects = document.querySelectorAll('select');
            let puan = 0;
            selects.forEach(s => puan += parseInt(s.value));

            const rb = document.getElementById('resultBox');
            rb.classList.remove('hidden');
            
            let msg, color;
            if (puan >= 15) { msg = "🚨 YÜKSEK RİSK: Acilen doktora görünün!"; color = "bg-red-900/50 border-red-500 text-red-100"; }
            else if (puan >= 7) { msg = "⚠️ ORTA RİSK: Belirtileri izleyin."; color = "bg-yellow-900/50 border-yellow-500 text-yellow-100"; }
            else { msg = "✅ DÜŞÜK RİSK: Şu an her şey yolunda görünüyor."; color = "bg-green-900/50 border-green-500 text-green-100"; }

            rb.innerHTML = `<div class="p-6 rounded-xl border-2 ${color} text-center font-bold animate-fade-in">${msg}</div>`;
            rb.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
