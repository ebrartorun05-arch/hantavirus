<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andes Virüsü Detaylı Analiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen py-10 flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
        <div class="bg-gradient-to-r from-red-700 to-indigo-800 p-8 text-center text-white">
            <h1 class="text-3xl font-bold">Andes Virüsü Tanı Sihirbazı</h1>
            <p class="text-indigo-200 mt-2 italic">Lütfen tüm soruları mevcut durumunuza göre yanıtlayın.</p>
        </div>

        <div class="p-8 space-y-6">
            <div id="soruFormu" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">1. Yüksek Ateş (38°C+)</label>
                    <select id="s1" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Yok</option><option value="3">Hafif</option><option value="8">Şiddetli</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">2. Öksürük</label>
                    <select id="s2" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Yok</option><option value="2">Kuru</option><option value="5">Balgamlı/Şiddetli</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">3. Nefes Darlığı</label>
                    <select id="s3" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Yok</option><option value="5">Eforda</option><option value="10">Dinlenirken</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">4. Yaygın Kas Ağrısı</label>
                    <select id="s4" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Yok</option><option value="2">Hafif</option><option value="6">Çok Şiddetli</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">5. Baş Ağrısı</label>
                    <select id="s5" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Yok</option><option value="2">Var</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">6. Karın Ağrısı</label>
                    <select id="s6" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Yok</option><option value="4">Var</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">7. İshal veya Kusma</label>
                    <select id="s7" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Yok</option><option value="3">Var</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">8. Titreme / Üşüme</label>
                    <select id="s8" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Yok</option><option value="3">Var</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">9. Şiddetli Halsizlik</label>
                    <select id="s9" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Yok</option><option value="4">Var</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-indigo-300 font-medium">10. Kemirgenlerle Temas?</label>
                    <select id="s10" class="w-full bg-slate-700 p-3 rounded-lg border-none outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                        <option value="0">Hayır</option><option value="10">Evet (Son 2 Hafta)</option>
                    </select>
                </div>
            </div>

            <button onclick="tamAnaliz()" class="w-full bg-white text-slate-900 font-bold py-5 rounded-2xl hover:bg-indigo-100 transition shadow-xl mt-6">
                DETAYLI ANALİZİ TAMAMLA
            </button>

            <div id="sonucPaneli" class="hidden p-6 rounded-2xl text-center border animate-fade-in">
                <h3 id="riskSeviyesi" class="text-2xl font-black mb-2"></h3>
                <p id="tavsiyeMetni" class="text-lg"></p>
            </div>
        </div>
    </div>

    <script>
        function tamAnaliz() {
            let puan = 0;
            for(let i=1; i<=10; i++) {
                puan += parseInt(document.getElementById('s' + i).value);
            }

            const panel = document.getElementById('sonucPaneli');
            const seviye = document.getElementById('riskSeviyesi');
            const tavsiye = document.getElementById('tavsiyeMetni');
            
            panel.classList.remove('hidden', 'bg-red-500/20', 'bg-yellow-500/20', 'bg-green-500/20', 'border-red-500', 'border-yellow-500', 'border-green-500');

            if (puan >= 20) {
                panel.classList.add('bg-red-500/20', 'border-red-500', 'text-red-400');
                seviye.innerText = "🚨 KRİTİK RİSK";
                tavsiye.innerText = "Belirtileriniz Andes Virüsü profiliyle yüksek oranda uyuşuyor. Acilen tam teşekküllü bir hastaneye başvurun.";
            } else if (puan >= 8) {
                panel.classList.add('bg-yellow-500/20', 'border-yellow-500', 'text-yellow-400');
                seviye.innerText = "⚠️ ORTA RİSK";
                tavsiye.innerText = "Bazı şüpheli belirtiler mevcut. Kendinizi izole edin ve bir doktora danışın.";
            } else {
                panel.classList.add('bg-green-500/20', 'border-green-500', 'text-green-400');
                seviye.innerText = "✅ DÜŞÜK RİSK";
                tavsiye.innerText = "Şu an için korkulacak bir durum yok, ancak istirahati ihmal etmeyin.";
            }
            panel.classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
